  <rect width="1200" height="630" fill="url(#background)"/>
  <circle cx="1050" cy="105" r="240" fill="#e3dfff" opacity=".72"/>
  <circle cx="190" cy="640" r="180" fill="#eee7ff" opacity=".9"/>
  <g font-family="DejaVu Sans, Arial, sans-serif">
