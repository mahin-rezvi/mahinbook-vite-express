    <rect x="778" y="103" width="48" height="48" rx="15" fill="#5b4bff"/>
    <text x="802" y="136" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">mb</text>
    <circle cx="1035" cy="126" r="7" fill="#72c899"/>
    <text x="779" y="194" font-size="22" font-weight="700" fill="#25263a">Your world, in one place</text>
