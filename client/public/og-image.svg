    <text x="160" y="123" font-size="30" font-weight="700" letter-spacing="-1" fill="#202033">mahinbook</text>

    <text x="88" y="250" font-size="16" font-weight="700" letter-spacing="3" fill="#5b4bff">A PLACE FOR YOUR PEOPLE</text>
    <text x="88" y="316" font-size="62" font-weight="700" letter-spacing="-3" fill="#191a2c">Connect with</text>
    <text x="88" y="386" font-size="62" font-weight="700" letter-spacing="-3" fill="#6758f5">friends and</text>
    <text x="88" y="456" font-size="62" font-weight="700" letter-spacing="-3" fill="#191a2c">communities.</text>
    <text x="91" y="516" font-size="21" fill="#66697c">A social network for sharing moments,</text>
    <text x="91" y="548" font-size="21" fill="#66697c">finding groups, and staying close.</text>

    <rect x="770" y="89" width="350" height="451" rx="34" fill="#dcd7ff" opacity=".56"/>
